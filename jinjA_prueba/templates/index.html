<!DOCTYPE html>
<html lang="es">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Mi Primera Página con Flask</title>
    <style>
        body {
            font-family: Arial, sans-serif;
            background-color: #f4f4f9;
            color: #333;
            display: flex;
            justify-content: center;
            align-items: center;
            height: 100vh;
            margin: 0;
        }

        .card {
            background: white;
            padding: 2rem;
            border-radius: 12px;
            box-shadow: 0 4px 10px rgba(0, 0, 0, 0.1);
            text-align: center;
            max-width: 400px;
        }

        h1 {
            color: #2c3e50;
        }

        .highlight {
            color: #41b883;
            font-weight: bold;
        }
    </style>
</head>

<body>
    <div class="card">
        <h1>¡Bienvenido, {{ usuario }}! 🎉</h1>
        <p>Tu servidor de <span class="highlight">Flask</span> está corriendo correctamente.</p>
        <p>Esta plantilla fue procesada usando <strong>Jinja2</strong>.</p>
    </div>
</body>

</html>
