{% extends 'base.html' %}
{% block title %}BookHub | Inicia sesión{% endblock %}
{% block content %}
<section class="auth-intro">
  <a class="brand brand-large" href="{{ url_for('inicio') }}"><span class="brand-mark"><i class="bi bi-book-half"></i></span>BookHub</a>
  <p>Comparte, descubre y comenta libros.</p>
</section>
<div class="auth-grid">
  <section class="auth-panel" aria-labelledby="register-title">
    <div class="panel-heading"><h1 id="register-title">Crear cuenta</h1></div>
    <form action="{{ url_for('registro') }}" method="post" class="form-stack">
      <div class="row g-3"><div class="col-sm-6"><label class="form-label" for="name">Nombre</label><input class="form-control" id="name" name="name" required minlength="2" maxlength="60" autocomplete="given-name"></div><div class="col-sm-6"><label class="form-label" for="surname">Apellido</label><input class="form-control" id="surname" name="surname" required minlength="2" maxlength="60" autocomplete="family-name"></div></div>
      <div><label class="form-label" for="register-email">E-mail</label><input class="form-control" type="email" id="register-email" name="email" required maxlength="150" autocomplete="email"></div>
      <div><label class="form-label" for="register-password">Contraseña</label><input class="form-control" type="password" id="register-password" name="password" required minlength="8" autocomplete="new-password"></div>
      <div><label class="form-label" for="confirm-password">Confirmar contraseña</label><input class="form-control" type="password" id="confirm-password" name="confirm_password" required minlength="8" autocomplete="new-password"></div>
      <button class="btn btn-ink w-100" type="submit">Registrarme <i class="bi bi-arrow-right ms-1"></i></button>
    </form>
  </section>
  <section class="auth-panel login-panel" aria-labelledby="login-title">
    <div class="panel-heading"><h2 id="login-title">Iniciar sesión</h2></div>
    <form action="{{ url_for('login') }}" method="post" class="form-stack">
      <div><label class="form-label" for="login-email">E-mail</label><input class="form-control" type="email" id="login-email" name="email" required autocomplete="email"></div>
      <div><label class="form-label" for="login-password">Contraseña</label><input class="form-control" type="password" id="login-password" name="password" required autocomplete="current-password"></div>
      <button class="btn btn-ink w-100" type="submit">Iniciar sesión</button>
    </form>
    <p class="login-switch">¿No tienes cuenta? <a href="#register-title">Regístrate aquí.</a></p>
  </section>
</div>
{% endblock %}
