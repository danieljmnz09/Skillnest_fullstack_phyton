<!DOCTYPE html>
<html lang="es">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Inicio</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.2/dist/css/bootstrap.min.css" rel="stylesheet">
</head>

<body>

    <div class="container py-5">

        <!-- Secciones de alertas y errores -->
        <div class="row mb-3">
            <div class="col-12">
                {% with msgs = get_flashed_messages(category_filter=["registro_error", "login_error"]) %}
                {% if msgs %}
                {% for msg in msgs %}
                <div class="alert alert-danger alert-dismissible fade show" role="alert">
                    {{ msg }}
                    <button type="button" class="btn-close" data-bs-dismiss="alert" aria-label="Close"></button>
                </div>
                {% endfor %}
                {% endif %}
                {% endwith %}
            </div>
        </div>

        <div class="row g-5 justify-content-between">

            <!-- REGISTRO (Izquierda) -->
            <div class="col-md-6">
                <h2 class="fw-normal mb-4 text-center text-md-start">Registro</h2>

                <form action="{{ url_for('registrar') }}" method="POST">

                    <div class="row mb-3 align-items-center">
                        <label for="nombre" class="col-sm-4 col-form-label">Nombre</label>
                        <div class="col-sm-8">
                            <input type="text" name="nombre" id="nombre" class="form-control" required>
                        </div>
                    </div>

                    <div class="row mb-3 align-items-center">
                        <label for="apellido" class="col-sm-4 col-form-label">Apellido</label>
                        <div class="col-sm-8">
                            <input type="text" name="apellido" id="apellido" class="form-control" required>
                        </div>
                    </div>

                    <div class="row mb-3 align-items-center">
                        <label for="email_reg" class="col-sm-4 col-form-label">E-mail</label>
                        <div class="col-sm-8">
                            <input type="email" name="email" id="email_reg" class="form-control" required>
                        </div>
                    </div>

                    <div class="row mb-3 align-items-center">
                        <label for="fecha_nacimiento" class="col-sm-4 col-form-label">Fecha Nac.</label>
                        <div class="col-sm-8">
                            <input type="date" name="fecha_nacimiento" id="fecha_nacimiento" class="form-control"
                                required>
                        </div>
                    </div>

                    <div class="row mb-3 align-items-center">
                        <label for="password_reg" class="col-sm-4 col-form-label">Contraseña</label>
                        <div class="col-sm-8">
                            <input type="password" name="password" id="password_reg" class="form-control" required>
                        </div>
                    </div>

                    <div class="row mb-4 align-items-center">
                        <label for="confirm_password" class="col-sm-4 col-form-label">Conf. Contraseña</label>
                        <div class="col-sm-8">
                            <input type="password" name="confirm_password" id="confirm_password" class="form-control"
                                required>
                        </div>
                    </div>

                    <div class="row">
                        <div class="col-sm-8 offset-sm-4 text-center text-sm-start">
                            <button type="submit"
                                class="btn btn-outline-dark px-4 shadow-sm fw-semibold">Registrar</button>
                        </div>
                    </div>

                </form>
            </div>

            <!-- INICIO DE SESIÓN (Derecha) -->
            <div class="col-md-5">
                <h2 class="fw-normal mb-4 text-center text-md-start">Inicio de Sesión</h2>

                <form action="{{ url_for('login') }}" method="POST">

                    <div class="row mb-3 align-items-center">
                        <label for="email_login" class="col-sm-4 col-form-label">E-mail</label>
                        <div class="col-sm-8">
                            <input type="email" name="email" id="email_login" class="form-control" required>
                        </div>
                    </div>

                    <div class="row mb-4 align-items-center">
                        <label for="password_login" class="col-sm-4 col-form-label">Contraseña</label>
                        <div class="col-sm-8">
                            <input type="password" name="password" id="password_login" class="form-control" required>
                        </div>
                    </div>

                    <div class="row">
                        <div class="col-sm-8 offset-sm-4 text-center text-sm-end">
                            <button type="submit" class="btn btn-outline-dark px-4 shadow-sm fw-semibold">Iniciar
                                Sesión</button>
                        </div>
                    </div>

                </form>
            </div>

        </div>
    </div>

    <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.2/dist/js/bootstrap.bundle.min.js"></script>
</body>

</html>
