<!DOCTYPE html>
<html lang="es">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>A Web Page</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.2/dist/css/bootstrap.min.css" rel="stylesheet">
</head>

<body>

    <div class="container py-5 ps-md-5">

        {% with msgs = get_flashed_messages(category_filter=["exito"]) %}
        {% if msgs %}
        {% for msg in msgs %}
        <div class="alert alert-success alert-dismissible fade show col-md-6 mb-4" role="alert">
            {{ msg }}
            <button type="button" class="btn-close" data-bs-dismiss="alert" aria-label="Close"></button>
        </div>
        {% endfor %}
        {% endif %}
        {% endwith %}

        <h1 class="display-3 fw-semibold mb-4">¡Hola {{ usuario.nombre }}!</h1>

        <div>
            <a href="{{ url_for('logout') }}" class="fs-5 text-primary text-decoration-underline">Cerrar Sesión</a>
        </div>

    </div>

    <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.2/dist/js/bootstrap.bundle.min.js"></script>
</body>

</html>
