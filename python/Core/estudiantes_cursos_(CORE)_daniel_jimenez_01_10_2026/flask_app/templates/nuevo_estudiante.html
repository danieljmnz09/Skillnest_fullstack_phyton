{% extends "base.html" %}

{% block title %}Nuevo Estudiante{% endblock %}

{% block content %}
<div class="row">
    <div class="col-md-6">
        <h2 class="h3 fw-bold mb-4">Nuevo Estudiante</h2>

        <!-- Formulario para agregar un nuevo estudiante -->
        <form action="{{ url_for('crear_estudiante') }}" method="POST">
            <!-- Selector de Curso -->
            <div class="row mb-3 align-items-center">
                <label for="curso_id" class="col-sm-3 col-form-label fw-semibold">Curso:</label>
                <div class="col-sm-8">
                    <select id="curso_id" name="curso_id" class="form-select style-input" required>
                        {% for curso in cursos %}
                        <option value="{{ curso.id }}">{{ curso.nombre }}</option>
                        {% endfor %}
                    </select>
                </div>
            </div>

            <!-- Campo Nombre -->
            <div class="row mb-3 align-items-center">
                <label for="nombre" class="col-sm-3 col-form-label fw-semibold">Nombre:</label>
                <div class="col-sm-8">
                    <input type="text" id="nombre" name="nombre" class="form-control style-input" required>
                </div>
            </div>

            <!-- Campo Apellido -->
            <div class="row mb-3 align-items-center">
                <label for="apellido" class="col-sm-3 col-form-label fw-semibold">Apellido:</label>
                <div class="col-sm-8">
                    <input type="text" id="apellido" name="apellido" class="form-control style-input" required>
                </div>
            </div>

            <!-- Campo Edad -->
            <div class="row mb-4 align-items-center">
                <label for="edad" class="col-sm-3 col-form-label fw-semibold">Edad:</label>
                <div class="col-sm-8">
                    <input type="number" id="edad" name="edad" class="form-control style-input" min="1" required>
                </div>
            </div>

            <!-- Boton Enviar -->
            <div class="mb-3">
                <button type="submit" class="btn btn-outline-dark px-4 shadow-sm">Crear</button>
            </div>

            <!-- Enlace para volver a la pagina principal -->
            <div>
                <a href="{{ url_for('cursos') }}" class="btn-link-action">Inicio</a>
            </div>
        </form>
    </div>
</div>
{% endblock %}
