<!DOCTYPE html>
<html lang="es">

<head>
    <meta charset="UTF-8">
    <title>TaskTrack - Categorías</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css" rel="stylesheet">
</head>

<body>
    <nav class="navbar navbar-expand navbar-dark bg-dark px-4">
        <a class="navbar-brand fw-bold" href="/tareas">✓ TaskTrack</a>
    </nav>

    <div class="container py-4">
        <div class="d-flex justify-content-between align-items-center mb-3">
            <h2>Categorías</h2>
            <a href="/categorias/nueva" class="btn btn-primary">+ Nueva Categoría</a>
        </div>

        <table class="table table-bordered">
            <thead class="table-light">
                <tr>
                    <th>Nombre</th>
                    <th>Cantidad de tareas</th>
                    <th>Acciones</th>
                </tr>
            </thead>
            <tbody>
                {% for c in categorias %}
                <tr>
                    <td>{{ c.nombre }}</td>
                    <td>{{ c.cantidad_tareas }}</td>
                    <td>
                        <form action="/categorias/{{ c.id }}/borrar" method="POST" class="d-inline">
                            <button class="btn btn-link p-0 text-danger text-decoration-none"
                                onclick="return confirm('¿Borrar categoría?')">Borrar</button>
                        </form>
                    </td>
                </tr>
                {% else %}
                <tr>
                    <td colspan="3" class="text-center">No hay categorías agregadas.</td>
                </tr>
                {% endfor %}
            </tbody>
        </table>
    </div>
</body>

</html>
