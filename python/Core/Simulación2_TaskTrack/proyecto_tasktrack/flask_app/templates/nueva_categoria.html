<!DOCTYPE html>
<html lang="es">

<head>
    <meta charset="UTF-8">
    <title>TaskTrack - Nueva Categoría</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css" rel="stylesheet">
</head>

<body class="bg-light">
    <div class="container py-5" style="max-width: 500px;">
        <h2 class="mb-4">Nueva Categoría</h2>

        <!-- Bloque para mostrar mensajes de error de Flash -->
        {% with msgs = get_flashed_messages(category_filter=["categoria"]) %}
        {% if msgs %}
        {% for m in msgs %}
        <div class="alert alert-warning py-1 small">{{ m }}</div>
        {% endfor %}
        {% endif %}
        {% endwith %}

        <form action="/categorias/crear" method="POST" class="card shadow-sm p-4">
            <div class="mb-3">
                <label class="form-label">Nombre:</label>
                <input type="text" name="nombre" class="form-control" required>
            </div>
            <div class="d-flex align-items-center gap-3">
                <button type="submit" class="btn btn-dark">Guardar</button>
                <a href="/categorias" class="text-decoration-none">Cancelar</a>
            </div>
        </form>
    </div>
</body>

</html>
