<!DOCTYPE html>
<html lang="es">

<head>
    <meta charset="UTF-8">
    <title>TaskTrack - Nueva Tarea</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css" rel="stylesheet">
</head>

<body>
    <nav class="navbar navbar-expand navbar-dark bg-dark px-4">
        <a class="navbar-brand fw-bold" href="/tareas">✓ TaskTrack</a>
    </nav>

    <div class="container py-4" style="max-width: 600px;">
        <h2>Nueva Tarea</h2>

        {% with msgs = get_flashed_messages(category_filter=["tarea"]) %}
        {% if msgs %}
        {% for m in msgs %}
        <div class="alert alert-warning py-1 small">{{ m }}</div>
        {% endfor %}
        {% endif %}
        {% endwith %}

        <form action="/tareas/crear" method="POST">
            <div class="mb-3">
                <label>Título:</label>
                <input type="text" name="titulo" class="form-control">
            </div>
            <div class="mb-3">
                <label>Categoría:</label>
                <select name="categoria_id" class="form-select">
                    <option value="">Selecciona una categoría</option>
                    {% for c in categorias %}
                    <option value="{{ c.id }}">{{ c.nombre }}</option>
                    {% endfor %}
                </select>
            </div>
            <div class="mb-3">
                <label>Prioridad:</label>
                <select name="prioridad" class="form-select">
                    <option value="">Selecciona una prioridad</option>
                    <option value="Alta">Alta</option>
                    <option value="Media">Media</option>
                    <option value="Baja">Baja</option>
                </select>
            </div>
            <div class="mb-3">
                <label>Fecha límite:</label>
                <input type="date" name="fecha_limite" class="form-control">
            </div>
            <div class="mb-3">
                <label>Descripción:</label>
                <textarea name="descripcion" class="form-control" rows="3"></textarea>
            </div>

            <button type="submit" class="btn btn-dark">Guardar</button>
            <a href="/tareas" class="btn btn-link text-decoration-none">Cancelar</a>
        </form>
    </div>
</body>

</html>
