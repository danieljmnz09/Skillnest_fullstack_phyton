<!DOCTYPE html>
<html lang="es">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Detalle de Estudiante</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.7/dist/css/bootstrap.min.css" rel="stylesheet">
    <link rel="stylesheet" href="{{ url_for('static', filename='css/style.css') }}">
</head>

<body>

    <div class="container py-5">
        <div class="card shadow-sm border-0 mx-auto" style="max-width: 600px;">
            <div class="card-body p-4">
                <h1 class="card-title mb-4">Estudiante #{{ estudiante.id_estudiante }}</h1>
                <div class="mb-3">
                    <strong>Nombre:</strong>
                    <p class="fs-5">{{ estudiante.nombre }}</p>
                </div>
                <div class="mb-3">
                    <strong>Email:</strong>
                    <p class="fs-5">{{ estudiante.email }}</p>
                </div>
                <div class="mb-4">
                    <strong>Fecha Creación:</strong>
                    <p class="text-muted">{{ estudiante.created_at }}</p>
                </div>
                <div class="d-flex gap-2">
                    <a href="{{ url_for('editar_estudiante', id_estudiante=estudiante.id_estudiante) }}"
                        class="btn btn-warning">Editar</a>
                    <a href="{{ url_for('eliminar_estudiante', id_estudiante=estudiante.id_estudiante) }}"
                        class="btn btn-danger"
                        onclick="return confirm('¿Estás seguro de eliminar este estudiante?');">Eliminar</a>
                    <a href="{{ url_for('estudiantes') }}" class="btn btn-outline-secondary ms-auto">Volver</a>
                </div>
            </div>
        </div>
    </div>

</body>

</html>
