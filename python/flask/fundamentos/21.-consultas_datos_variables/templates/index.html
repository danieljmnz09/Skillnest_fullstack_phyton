<!DOCTYPE html>
<html lang="es">

<head>

    <meta charset="UTF-8">

    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <title>Mis Mascotas</title>

</head>

<body>

    <h1>Mis Mascotas</h1>


    {% if mascotas %}

    {% for mascota in mascotas %}

    <h2>{{ mascota.nombre }}</h2>

    <p>
        Tipo: {{ mascota.tipo }}
    </p>

    <p>
        Color: {{ mascota.color }}
    </p>

    <a href="{{ url_for('mostrar_mascota', id=mascota.id) }}">
        Ver detalles
    </a>

    <hr>

    {% endfor %}

    {% else %}

    <p>
        No existen mascotas registradas.
    </p>

    {% endif %}


</body>

</html>
