<!DOCTYPE html>
<html lang="es">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Restaurantes</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.7/dist/css/bootstrap.min.css" rel="stylesheet">
</head>

<body>
    <div class="container py-5">
        <div class="d-flex justify-content-between align-items-center mb-4">
            <h1>Restaurantes</h1>
            <div>
                <a href="{{ url_for('index') }}" class="btn btn-primary">Crear Taco</a>
                <a href="{{ url_for('index_complementos') }}" class="btn btn-outline-info">Complementos</a>
            </div>
        </div>

        <div class="row g-4">
            {% for restaurante in restaurantes %}
            <div class="col-12 col-md-6 col-lg-4">
                <div class="card h-100 shadow-sm">
                    <div class="card-body">
                        <h2 class="h4">{{ restaurante.nombre }}</h2>
                        <p class="text-muted">ID: {{ restaurante.id }}</p>
                        <a href="{{ url_for('restaurante', id=restaurante.id) }}" class="btn btn-success">Ver tacos</a>
                    </div>
                </div>
            </div>
            {% endfor %}
        </div>
    </div>
</body>

</html>
