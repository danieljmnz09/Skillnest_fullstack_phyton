<!DOCTYPE html>
<html lang="es">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Seguidores</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css" rel="stylesheet">
</head>

<body class="bg-light">
    <div class="container py-4" style="max-width: 800px;">

        <!-- Título Principal -->
        <h1 class="fw-bold mb-4">Seguidores</h1>

        <!-- Tabla de Seguidores (Usuario vs Seguidor) -->
        <div class="table-responsive mb-5">
            <table class="table table-bordered border-dark bg-white align-middle">
                <thead class="table-secondary border-dark">
                    <tr>
                        <th scope="col" class="w-50">Usuario</th>
                        <th scope="col" class="w-50">Seguidor</th>
                    </tr>
                </thead>
                <tbody>
                    {% for rel in relaciones %}
                    <tr>
                        <td>{{ rel.usuario }}</td>
                        <td>{{ rel.seguidor }}</td>
                    </tr>
                    {% else %}
                    <tr>
                        <td colspan="2" class="text-center text-muted">Aún no hay conexiones entre usuarios.</td>
                    </tr>
                    {% endfor %}
                </tbody>
            </table>
        </div>

        <!-- Sección Inferior: Formularios paralelos -->
        <div class="row g-5">

            <!-- Formulario 1: Nuevo Usuario -->
            <div class="col-md-6">
                <h2 class="h3 fw-bold mb-3">Nuevo Usuario</h2>
                <form action="/usuarios/crear" method="POST">
                    <div class="mb-3 row">
                        <label for="nombre" class="col-sm-4 col-form-label fw-semibold">Nombre:</label>
                        <div class="col-sm-8">
                            <input type="text" id="nombre" name="nombre" class="form-control border-dark" required>
                        </div>
                    </div>

                    <div class="mb-3 row">
                        <label for="apellido" class="col-sm-4 col-form-label fw-semibold">Apellido:</label>
                        <div class="col-sm-8">
                            <input type="text" id="apellido" name="apellido" class="form-control border-dark" required>
                        </div>
                    </div>

                    <div class="mb-3 row">
                        <label for="email" class="col-sm-4 col-form-label fw-semibold">E-mail:</label>
                        <div class="col-sm-8">
                            <input type="email" id="email" name="email" class="form-control border-dark" required>
                        </div>
                    </div>

                    <button type="submit" class="btn btn-outline-dark border-2 px-4 shadow-sm">Crear</button>
                </form>
            </div>

            <!-- Formulario 2: Seguir -->
            <div class="col-md-6">
                <h2 class="h3 fw-bold mb-3">Seguir</h2>
                <form action="/seguidores/crear" method="POST">
                    <div class="mb-3 row">
                        <label for="usuario_id" class="col-sm-4 col-form-label fw-semibold">Usuario:</label>
                        <div class="col-sm-8">
                            <select name="usuario_id" id="usuario_id" class="form-select border-dark" required>
                                <option value="" disabled selected>-- Seleccionar --</option>
                                {% for u in todos_usuarios %}
                                <option value="{{ u.id }}">{{ u.nombre }} {{ u.apellido }}</option>
                                {% endfor %}
                            </select>
                        </div>
                    </div>

                    <div class="mb-3 row">
                        <label for="seguidor_id" class="col-sm-4 col-form-label fw-semibold">Seguidor:</label>
                        <div class="col-sm-8">
                            <select name="seguidor_id" id="seguidor_id" class="form-select border-dark" required>
                                <option value="" disabled selected>-- Seleccionar --</option>
                                {% for u in todos_usuarios %}
                                <option value="{{ u.id }}">{{ u.nombre }} {{ u.apellido }}</option>
                                {% endfor %}
                            </select>
                        </div>
                    </div>

                    <button type="submit" class="btn btn-outline-dark border-2 px-4 shadow-sm mt-2">Seguir</button>
                </form>
            </div>

        </div>
    </div>
</body>

</html>
