<!DOCTYPE html>
<html lang="es">

<head>
    <meta charset="UTF-8">
    <title>Todos los Usuarios</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.7/dist/css/bootstrap.min.css" rel="stylesheet">
    <link rel="stylesheet" href="{{ url_for('static', filename='css/style.css') }}">
</head>

<body>
    <div class="container py-5">
        <div class="d-flex justify-content-between align-items-center mb-4">
            <h1>Usuarios</h1>
            <a href="{{ url_for('nuevo_usuario') }}" class="btn btn-primary">Nuevo Usuario</a>
        </div>

        <div class="card shadow-sm border-0">
            <div class="card-body p-0">
                <table class="table table-hover mb-0">
                    <thead class="table-dark">
                        <tr>
                            <th>ID</th>
                            <th>Nombre Completo</th>
                            <th>E-mail</th>
                            <th>Fecha Creación</th>
                            <th>Acciones</th>
                        </tr>
                    </thead>
                    <tbody>
                        {% for usuario in usuarios %}
                        <tr>
                            <td>{{ usuario.id }}</td>
                            <td><strong>{{ usuario.nombre }} {{ usuario.apellido }}</strong></td>
                            <td>{{ usuario.email }}</td>
                            <td>{{ usuario.created_at.strftime("%Y-%m-%d") if usuario.created_at }}</td>
                            <td>
                                <a href="{{ url_for('ver_usuario', id=usuario.id) }}"
                                    class="btn btn-sm btn-outline-primary">Ver</a>
                                <a href="{{ url_for('editar_usuario', id=usuario.id) }}"
                                    class="btn btn-sm btn-outline-warning">Editar</a>
                                <a href="{{ url_for('borrar_usuario', id=usuario.id) }}"
                                    class="btn btn-sm btn-outline-danger">Borrar</a>
                            </td>
                        </tr>
                        {% endfor %}
                    </tbody>
                </table>
            </div>
        </div>
    </div>
</body>

</html>
