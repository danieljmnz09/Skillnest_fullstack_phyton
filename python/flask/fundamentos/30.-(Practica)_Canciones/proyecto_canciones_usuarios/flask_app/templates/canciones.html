{% extends "base.html" %}

{% block title %}Canciones{% endblock %}

{% block content %}
<div class="row g-5">
    <!-- Formulario para crear una nueva canción -->
    <div class="col-md-5">
        <h2 class="h3 fw-bold mb-4">Nueva Canción</h2>
        <form action="{{ url_for('crear_cancion') }}" method="POST">
            <div class="row mb-3 align-items-center">
                <label for="titulo" class="col-sm-3 col-form-label fw-semibold">Título:</label>
                <div class="col-sm-8">
                    <input type="text" id="titulo" name="titulo" class="form-control style-input" required>
                </div>
            </div>
            <div class="row mb-3 align-items-center">
                <label for="artista" class="col-sm-3 col-form-label fw-semibold">Artista:</label>
                <div class="col-sm-8">
                    <input type="text" id="artista" name="artista" class="form-control style-input" required>
                </div>
            </div>
            <button type="submit" class="btn btn-outline-dark px-4 shadow-sm">Crear</button>
        </form>

        <div class="mt-4">
            <a href="{{ url_for('usuarios') }}" class="btn-link-action">Inicio</a>
        </div>
    </div>

    <!-- Lista de todas las canciones -->
    <div class="col-md-6">
        <h2 class="h3 fw-bold mb-4">Todas las Canciones</h2>

        <div class="list-box mb-3">
            {% if canciones %}
            <ul class="list-unstyled mb-0">
                {% for cancion in canciones %}
                <li class="mb-2">
                    <a href="{{ url_for('mostrar_cancion', id=cancion.id) }}" class="custom-link">
                        {{ cancion.titulo }}
                    </a>
                </li>
                {% endfor %}
            </ul>
            {% else %}
            <p class="text-muted mb-0">No hay canciones registradas.</p>
            {% endif %}
        </div>
    </div>
</div>
{% endblock %}
