<!DOCTYPE html>
<html lang="es">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Pedidos de Arepas</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css" rel="stylesheet">
</head>

<body class="bg-white">
    <div class="container py-4" style="max-width: 700px;">

        <!-- Encabezado con título y enlace a /pedido -->
        <div class="d-flex justify-content-between align-items-center mb-4">
            <h1 class="fw-bold">Pedidos:</h1>
            <a href="/pedido" class="fs-5 text-primary text-decoration-underline">Nuevo Pedido</a>
        </div>

        <!-- Tabla con borde y estilos idénticos al wireframe -->
        <div class="table-responsive">
            <table class="table table-bordered border-dark align-middle mb-0">
                <thead class="table-secondary border-dark">
                    <tr>
                        <th>Nombre Cliente</th>
                        <th>Cantidad</th>
                        <th>Relleno</th>
                    </tr>
                </thead>
                <tbody>
                    {% for p in pedidos %}
                    <tr>
                        <td>{{ p.nombre }}</td>
                        <td>{{ p.cantidad }}</td>
                        <td>{{ p.relleno }}</td>
                    </tr>
                    {% else %}
                    <tr>
                        <td colspan="3" class="text-center text-muted">No hay pedidos registrados.</td>
                    </tr>
                    {% endfor %}
                </tbody>
            </table>
        </div>

    </div>
</body>

</html>
