<!DOCTYPE html>
<html lang="es">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Perfil de Usuario</title>
</head>

<body>
    <nav>
        <a href="{{ url_for('index') }}">Inicio</a> |
        <a href="{{ url_for('perfil') }}">Perfil</a>
    </nav>
    <hr>

    <h1>Perfil de usuario</h1>

    {% if session.get('nombre_usuario') %}
    <p><strong>Nombre:</strong> {{ session['nombre_usuario'] }}</p>
    <p><strong>Email:</strong> {{ session['email_usuario'] }}</p>
    <p><strong>Ciudad:</strong> {{ session['ciudad_usuario'] }}</p>
    {% else %}
    <p>No hay una sesión activa. Registra un usuario primero.</p>
    {% endif %}

    <hr>
    <a href="{{ url_for('index') }}">Volver al inicio</a>
</body>

</html>
